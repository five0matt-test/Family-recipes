<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#195d4d"><title>Family Recipes</title><link rel="stylesheet" href="assets/site.css"><style>body{max-width:970px;margin:28px auto;padding:0 17px}</style></head><body><header class="site-header"><h1>Family Recipes</h1><nav class="site-nav" aria-label="Main navigation"><a aria-current="page" href="index.html">Recipes</a><a href="plans/index.html">Weekly meal plans</a></nav></header><p class="intro">Find something delicious, then open a recipe in Safari and choose Share → AnyList Recipe Import.</p><section class="controls" aria-label="Find recipes"><div class="field search-field"><label for="q">Search recipe names or ingredients</label><input type="search" id="q" placeholder="Try basil, chicken, steak…"></div><div class="field"><label for="cuisine">Cuisine</label><select id="cuisine"><option value="">All cuisines</option><option value="American">American</option><option value="Asian-inspired">Asian-inspired</option><option value="Italian">Italian</option><option value="Mexican">Mexican</option><option value="Thai">Thai</option><option value="Vietnamese">Vietnamese</option></select></div><div class="field"><label for="meal">Meal type</label><select id="meal"><option value="">All meal types</option><option value="Dinner">Dinner</option><option value="Lunch">Lunch</option><option value="Main course">Main course</option><option value="Pickles">Pickles</option><option value="Salsa">Salsa</option><option value="Side">Side</option></select></div><div class="field"><label for="tag">Tags / protein</label><select id="tag"><option value="">All tags</option><option value="30 Minutes or Less">30 Minutes or Less</option><option value="Beef">Beef</option><option value="Chicken">Chicken</option><option value="Meal Prep">Meal Prep</option><option value="Pickled">Pickled</option><option value="Pork">Pork</option><option value="Vegetarian">Vegetarian</option></select></div><div class="field"><label for="time">Cooking time</label><select id="time"><option value="">Any time</option><option value="30">30 min or less</option><option value="45">45 min or less</option><option value="60">60 min or less</option></select></div><div class="field"><label for="sort">Sort</label><select id="sort"><option value="original">Original order</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="time">Shortest cooking time</option><option value="cuisine">Cuisine A–Z</option></select></div></section><div class="toolbar-row"><label><input type="checkbox" id="favoritesOnly"> Favorites only</label><button id="clearFilters">Clear filters</button><span class="results" id="results" role="status" aria-live="polite"></span></div><section id="recentSection" hidden><h2 class="section-title">Recently viewed</h2><div class="recent-list" id="recentList"></div></section><section aria-label="Recipe results" id="recipes"></section><p class="empty" id="empty" hidden>No recipes match. Try clearing a filter.</p><script src="assets/home.js" defer></script></body></html>
